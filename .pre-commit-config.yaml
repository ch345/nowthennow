repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^pipeline/
      - id: ruff-format
        files: ^pipeline/

  - repo: local
    hooks:
      - id: web-format
        name: prettier (web)
        entry: bash -c 'cd web && npx prettier --write "${@#web/}"' --
        language: system
        files: ^web/
        types_or: [ts, tsx, javascript, json, css, html]
      - id: web-lint
        name: oxlint (web)
        entry: bash -c 'cd web && npx oxlint'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
