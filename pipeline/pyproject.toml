[project]
name = "ntn"
version = "0.1.0"
description = "Crawler, indexer, and enrichment pipeline for now then now"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dateparser>=1.4.3",
    "fsspec>=2026.9.0",
    "httpx>=0.28.1",
    "openai>=1.60",
    "huggingface-hub>=2.1.1",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "tenacity>=9.1.4",
    "trafilatura>=2.3.0",
    "typer>=0.16",
]

[project.scripts]
ntn = "ntn.cli:app"

[project.optional-dependencies]
ml = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "umap-learn>=0.5.6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# polars, fsspec and lxml ship partial or no type information.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
# tokenizers caps huggingface-hub below 2, but only uses it for Tokenizer.from_pretrained, which
# we don't call (embed.py downloads files itself).
override-dependencies = ["huggingface-hub>=2.1.1"]
